[project]
name = "anotify"
version = "0.1.0"
description = "可扩展的任务调度通知框架：触发器 + 行为插件 + 事件总线，TOML 配置驱动"
readme = "README.md"
authors = [
    { name = "徐侨", email = "xu.qiao@kotei.com.cn" }
]
requires-python = ">=3.6"
dependencies = [
    "schedule>=1.2",
    "ipush>=0.4",
    "loguru>=0.7",
]

[project.scripts]
anotify = "anotify.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
