[project]
name = "anotiflow"
version = "0.1.1"
description = "可扩展的任务调度通知框架：触发器 + 行为插件 + 事件总线，TOML 配置驱动"
readme = "README.md"
authors = [
    { name = "wmymz", email = "wmymz@icloud.com" }
]
requires-python = ">=3.6"
dependencies = [
    "schedule>=1.2",
    "ipush>=0.4",
    "loguru>=0.7",
]

[project.urls]
"Homepage" = "https://github.com/qy527145/anotiflow"
"Documentation" = "https://github.com/qy527145/anotiflow"
"Repository" = "https://github.com/qy527145/anotiflow"
"Issues" = "https://github.com/qy527145/anotiflow/issues"

[project.scripts]
anotiflow = "anotiflow.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
