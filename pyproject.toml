[project]
name = "anotiflow"
version = "0.2.1"
description = "可扩展的任务调度通知框架：触发器 + 行为插件 + 事件总线 + Web 控制台 + 远程动作 SDK"
readme = "README.md"
authors = [
    { name = "wmymz", email = "wmymz@icloud.com" }
]
requires-python = ">=3.9"
dependencies = [
    "schedule>=1.2",
    "ipush>=0.4",
    "loguru>=0.7",
    "tomli>=2.0;python_version<'3.11'",
    "tomli_w>=1.0",
    "watchdog>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]

[project.urls]
"Homepage" = "https://github.com/qy527145/anotiflow"
"Documentation" = "https://github.com/qy527145/anotiflow"
"Repository" = "https://github.com/qy527145/anotiflow"
"Issues" = "https://github.com/qy527145/anotiflow/issues"

[project.scripts]
anotiflow = "anotiflow.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
