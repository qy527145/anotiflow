# anotiflow 示例配置
# ────────────────────────────────────────────────────────────────────────────
# 一个任务 = N 个触发器 + N 个行为；任意触发器命中即按顺序执行所有行为
# ────────────────────────────────────────────────────────────────────────────

# ── server 段（可选；不写则用下面的默认值）─────────────────────────────────
# 第一次启动时 admin_token 自动生成并回写到这里。
[server]
host = "127.0.0.1"
port = 8765
admin_token = ""              # 留空表示自动生成；打印在日志里
action_timeout_seconds = 30
offline_policy = "queue"      # queue | drop | error（远程动作客户端离线时的策略）
#
# 行为模板可访问的命名空间（在 message_template / publish_event.payload 中用 "{...}" 引用）：
#
#   {task.name}                       任务名（= task.config[name]）
#   {task.config[xxx]}                当前任务的 [[tasks]] 段中任意字段
#                                     （包括 type/triggers/actions 这些调度字段，也包括用户自加字段）
#
#   {trigger.config[name]}            命中触发器的 name（用户在 [[tasks.triggers]] 中显式写的；
#                                     未写时为 "<type>#<idx>"）
#   {trigger.config[xxx]}             命中触发器的 [[tasks.triggers]] 段中任意字段
#                                     （type / every / unit / event / 以及任何自定义字段）
#   {trigger.kind}                    "interval" / "event"
#   {trigger.fired_at}                本次命中时刻 "YYYY-MM-DD HH:MM:SS"
#   {trigger.payload[xxx]}            事件载荷字段（事件触发时来自发布者；定时触发为 {}）
#
# 这种命名空间访问彻底消除了"用户字段名与框架字段冲突"的问题 —— 你可以在任意 [[tasks]] /
# [[tasks.triggers]] 段里写任意字段（包括 type/every/unit/name 等内置字段），全部能通过
# task.config / trigger.config 读到。
#
# IntervalTrigger 完整保留 schedule 库的灵活性：
#   unit:  seconds/second, minutes/minute, hours/hour, days/day, weeks/week,
#          以及 monday..sunday
#   每 5 秒                  → unit="seconds", every=5
#   每 5~10 秒随机            → unit="seconds", every=5, to=10
#   每分钟的第 23 秒           → unit="minute",  at=":23"
#   每天 09:30                → unit="day",     at="09:30"
#   每周一 13:15              → unit="monday",  at="13:15"
#   每小时执行直到 18:30       → unit="hour",    until="18:30"


# ── 任务 1：定时检查股价 ─────────────────────────────────────────────────────
# 每 5 秒检查一次，条件满足时广播 stock.high 事件（业务逻辑写在 user_actions.py）
[[tasks]]
name = "check_stock_price"
enabled = true
# 任意业务字段都可以写在这里，模板里通过 task.config[xxx] 读取
symbol = "AAPL"
threshold = 100.0

[[tasks.triggers]]
name = "every_5s_tick"
type = "interval"
every = 5
unit = "seconds"

[[tasks.actions]]
type = "custom"
path = "examples.user_actions.check_stock_price"


# ── 任务 2：多触发器 + 各自的自定义配置 ─────────────────────────────────────
# 每个触发器都有 name 和任意自定义字段（source / severity / emoji ...）。
# 同一组飞书 + 钉钉行为，根据"是哪个触发器命中"动态拼出不同消息。
[[tasks]]
name = "notify_with_multi_triggers"
enabled = true

[[tasks.triggers]]
name = "tick_every_12s"
type = "interval"
every = 12
unit = "seconds"
source = "定时巡检"
severity = "info"
emoji = "🕒"

[[tasks.triggers]]
name = "stock_price_high"
type = "event"
event = "stock.high"
source = "股价告警"
severity = "warning"
emoji = "⚠️"

[[tasks.triggers]]
name = "manually_fired"
type = "event"
event = "manual.fire"
source = "手动触发"
severity = "critical"
emoji = "🔥"

[[tasks.actions]]
type = "feishu"
token = "53xxxx"
secret = "Ayxxxx"
message_template = """{trigger.config[emoji]} [{trigger.config[severity]}] {trigger.config[source]}
任务={task.config[name]}  触发器={trigger.config[name]}  时间={trigger.fired_at}
载荷={trigger.payload}
<at user_id='all'>所有人</at>"""

[[tasks.actions]]
type = "dingtalk"
token = "REPLACE_ME_DINGTALK_TOKEN"
secret = ""
title = "{trigger.config[emoji]} {trigger.config[source]}"
message_template = "[{trigger.config[severity]}] {task.config[name]} via {trigger.kind}@{trigger.fired_at} payload={trigger.payload}"


# ── 任务 3：定时广播 manual.fire 事件（演示 publish_event + 链式联动） ──────
# 每天 09:30 触发；演示 unit="day" + at="HH:MM"。
# 想立刻看到效果可临时改成 unit="seconds" + every=20。
# payload 里的 "{xxx}" 会用 context 渲染。
[[tasks]]
name = "daily_morning_fire"
enabled = false   # 默认关闭以免长时间等到 09:30；按需开启

[[tasks.triggers]]
name = "every_morning_0930"
type = "interval"
unit = "day"
at = "09:30"

[[tasks.actions]]
type = "publish_event"
event = "manual.fire"

[tasks.actions.payload]
reason = "{task.config[name]}@{trigger.fired_at}"
source_trigger = "{trigger.config[name]}"


# ── 任务 4：每周一 09:00 + 每天 18:30 双触发器 ─────────────────────────────
# 演示 weekday + 多触发器 + until + custom action 直接读 task / trigger 实例。
[[tasks]]
name = "weekly_and_daily_demo"
enabled = false

[[tasks.triggers]]
name = "monday_morning"
type = "interval"
unit = "monday"
at = "09:00"

[[tasks.triggers]]
name = "daily_evening"
type = "interval"
unit = "day"
at = "18:30"
until = "2026-12-31 23:59"

[[tasks.actions]]
type = "custom"
path = "examples.user_actions.print_context"


# ── 任务 5：API 触发 + 飞书通知 ─────────────────────────────────────────────
# webhook 风格接入：外部服务 POST 到 /trigger/<token> 就能触发。
# 首次加载时 anotiflow 会自动给缺失 token 的 api 触发器签发一个并回写到本文件。
[[tasks]]
name = "webhook_demo"
enabled = false

[[tasks.triggers]]
name = "incoming_webhook"
type = "api"
# token = "trg_xxxxxxxxxxxxxxxxxxxx"   # 留空自动签发；可在 Web UI 的 Tokens 面板复制

[[tasks.actions]]
type = "publish_event"
event = "webhook.incoming"
[tasks.actions.payload]
from = "{trigger.payload[source]}"
at = "{trigger.fired_at}"


# ── 任务 6：远程自定义动作 ─────────────────────────────────────────────────
# 动作逻辑跑在另一台机器 / 另一个 venv 的客户端进程里，宿主进程不再负责执行。
# 客户端代码参见 examples/remote_client.py：
#
#   from anotiflow import RemoteAction
#   action = RemoteAction("ws://host:8765", token="<下面的 token>")
#   @action.handler
#   def handle(ctx): ...
#   action.run()
#
# token 也会自动签发，可以在 Web UI 复制 SDK 代码片段（已把 token 填好）。
[[tasks]]
name = "remote_action_demo"
enabled = false

[[tasks.triggers]]
type = "interval"
unit = "seconds"
every = 10

[[tasks.actions]]
type = "custom"
remote = true
# token = "act_xxxxxxxxxxxxxxxxxxxx"   # 留空自动签发
wait = true                   # true=等待客户端回包（阻塞）；false=fire-and-forget
timeout_seconds = 30
offline_policy = "queue"      # 客户端未上线时：queue 堆积 / drop 丢弃 / error 抛错
publish_on_success = "remote_action_demo.done"
